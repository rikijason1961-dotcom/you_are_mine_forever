<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
        const navigationEntry = performance.getEntriesByType('navigation')[0];
        if (navigationEntry && navigationEntry.type === 'reload') {
            localStorage.removeItem('my_love_ultimate');
            const isIndexPage = location.pathname === '/' || /\/index\.html$/i.test(location.pathname);
            if (!isIndexPage) location.replace('index.html');
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#16040d">
    <meta name="description" content="A date invitation made just for you.">
    <title>Will You Go on a Date With Me? 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,700&family=Dancing+Script:wght@600;700&family=Outfit:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            box-sizing: border-box;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
            background:
                radial-gradient(ellipse at 50% 40%, rgba(190, 24, 93, 0.2), transparent 42%),
                radial-gradient(ellipse at 8% 10%, rgba(251, 113, 133, 0.12), transparent 34%),
                radial-gradient(ellipse at 95% 92%, rgba(124, 26, 74, 0.24), transparent 38%),
                #08050a;
            color: white;
            font-family: 'Outfit', sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        .font-main-title {
            font-family: 'Dancing Script', cursive;
        }

        .font-elegant {
            font-family: 'Playfair Display', serif;
            font-style: italic;
        }

        .date-input {
            color-scheme: dark;
            min-height: 3rem;
            font-size: 16px;
            touch-action: manipulation;
        }

        .date-card {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            border-color: rgba(255, 180, 210, 0.2);
            background: linear-gradient(145deg, rgba(47, 15, 36, 0.88), rgba(15, 9, 18, 0.94) 56%, rgba(39, 12, 29, 0.9));
            box-shadow: 0 30px 100px rgba(190, 24, 93, 0.18), inset 0 1px 0 rgba(255, 230, 240, 0.12);
        }

        .date-card::before {
            position: absolute;
            z-index: -1;
            top: -11rem;
            left: 50%;
            width: 25rem;
            height: 25rem;
            border-radius: 9999px;
            background: rgba(236, 72, 153, 0.14);
            content: "";
            filter: blur(75px);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .date-kicker {
            display: inline-flex;
            min-height: 2rem;
            align-items: center;
            justify-content: center;
            gap: 0.55rem;
            border: 1px solid rgba(244, 114, 182, 0.22);
            border-radius: 9999px;
            background: rgba(244, 114, 182, 0.08);
            padding: 0.35rem 0.85rem;
        }

        .date-kicker span {
            color: #f9a8d4;
        }

        .date-title {
            text-shadow: 0 0 30px rgba(244, 114, 182, 0.26);
        }

        .date-field label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #ffe4ef;
        }

        .date-input,
        #location {
            border-color: rgba(255, 190, 215, 0.16);
            background: rgba(8, 5, 10, 0.48);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.035);
            transition: border-color 180ms ease, background-color 180ms ease, box-shadow 180ms ease;
        }

        .date-input:focus,
        #location:focus {
            border-color: rgba(244, 114, 182, 0.72);
            background: rgba(22, 8, 19, 0.78);
            box-shadow: 0 0 0 3px rgba(236, 72, 153, 0.14);
        }

        .date-input::-webkit-calendar-picker-indicator {
            cursor: pointer;
            opacity: 0.85;
        }

        .date-submit {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 210, 230, 0.28);
            background: linear-gradient(110deg, #be185d, #ec4899 52%, #e11d48);
            box-shadow: 0 10px 28px rgba(190, 24, 93, 0.28), inset 0 1px 0 rgba(255, 255, 255, 0.18);
        }

        .date-submit::after {
            position: absolute;
            top: 0;
            left: -130%;
            width: 55%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.24), transparent);
            content: "";
            transform: skewX(-20deg);
            transition: left 550ms ease;
            pointer-events: none;
        }

        .date-submit:hover::after {
            left: 150%;
        }

        .date-back {
            display: inline-flex;
            min-height: 2.5rem;
            align-items: center;
            justify-content: center;
            border-radius: 9999px;
            padding: 0.5rem 0.85rem;
            transition: color 180ms ease, background-color 180ms ease;
        }

        .date-back:hover {
            background: rgba(244, 114, 182, 0.09);
        }

        @media (prefers-reduced-motion: reduce) {
            .date-submit::after {
                transition: none;
            }
        }

        @media (max-width: 480px) and (max-height: 700px) {
            body {
                padding: max(0.5rem, env(safe-area-inset-top)) max(0.5rem, env(safe-area-inset-right)) max(0.5rem, env(safe-area-inset-bottom)) max(0.5rem, env(safe-area-inset-left));
            }

            main {
                padding: 0.75rem;
                border-radius: 1.25rem;
            }

            header {
                margin-bottom: 0.75rem;
            }

            header > p:first-child {
                margin-bottom: 0.25rem;
                font-size: 0.625rem;
                letter-spacing: 0.12em;
                line-height: 1.25;
                min-height: 1.6rem;
                padding: 0.2rem 0.55rem;
            }

            header h1.font-main-title {
                font-size: 1.75rem;
                line-height: 1.1;
            }

            header p:last-child {
                margin-top: 0.375rem;
                font-size: 0.875rem;
                line-height: 1.3;
            }

            #date-form {
                display: grid;
                grid-template-columns: 1fr 1fr;
                column-gap: 0.5rem;
                row-gap: 0.5rem;
            }

            #date-form > :not([hidden]) ~ :not([hidden]) {
                margin-top: 0;
            }

            #date-form > div {
                min-width: 0;
            }

            #date-form > div:last-of-type,
            #date-form > button {
                grid-column: 1 / -1;
            }

            #date-form label {
                margin-bottom: 0.125rem;
                font-size: 0.75rem;
                line-height: 1.2;
            }

            .date-input {
                min-height: 2.625rem;
                padding: 0.375rem 0.5rem;
            }

            #location {
                min-height: 2.625rem;
                padding: 0.5rem;
            }

            #date-form > button {
                min-height: 2.75rem;
                padding: 0.5rem;
                font-size: 0.8125rem;
            }

            main > p {
                margin-top: 0.5rem;
                font-size: 0.6875rem;
                line-height: 1.3;
            }

            main > div:last-child {
                margin-top: 0.5rem;
            }

            main > div:last-child a {
                display: inline-flex;
                min-height: 2.5rem;
                align-items: center;
                justify-content: center;
                padding: 0.5rem;
            }
        }
    </style>
</head>

<body class="flex items-center justify-center">
    <main class="my-auto w-full max-w-2xl rounded-[1.75rem] border border-pink-200/10 bg-white/[0.06] p-5 shadow-[0_30px_100px_rgba(190,24,93,0.12)] backdrop-blur-xl sm:my-6 sm:rounded-[2rem] sm:p-8 md:rounded-[2.5rem] md:p-12">
        <header class="mb-7 text-center sm:mb-9">
            <p class="date-kicker mb-3 text-xs uppercase tracking-[0.25em] text-pink-200 sm:tracking-[0.35em]"><span aria-hidden="true">✦</span> A little question for you <span aria-hidden="true">✦</span></p>
            <h1 class="date-title font-main-title text-4xl leading-tight text-pink-300 sm:text-5xl md:text-7xl">Will You Go on a Date With Me?</h1>
            <p class="font-elegant mt-4 text-base leading-relaxed text-pink-100/90 sm:mt-5 sm:text-lg md:text-xl">Pick a day, a time, and a place... and let me make it special. ❤️</p>
        </header>

        <form id="date-form" class="space-y-4 sm:space-y-5">
            <div class="date-field">
                <label for="date" class="mb-2 block text-sm font-medium text-pink-100">📅 Date</label>
                <input id="date" name="date" type="date" required class="date-input w-full min-w-0 rounded-xl border border-pink-200/15 bg-black/30 px-3 py-3 text-base text-white outline-none transition focus:border-pink-400 focus:ring-2 focus:ring-pink-500/20 sm:px-4 sm:py-3.5">
            </div>
            <div class="date-field">
                <label for="time" class="mb-2 block text-sm font-medium text-pink-100">⏰ Time</label>
                <input id="time" name="time" type="time" required class="date-input w-full min-w-0 rounded-xl border border-pink-200/15 bg-black/30 px-3 py-3 text-base text-white outline-none transition focus:border-pink-400 focus:ring-2 focus:ring-pink-500/20 sm:px-4 sm:py-3.5">
            </div>
            <div class="date-field">
                <label for="location" class="mb-2 block text-sm font-medium text-pink-100">📍 Location</label>
                <input id="location" name="location" type="text" required maxlength="120" autocomplete="street-address" enterkeyhint="done" placeholder="Where should we meet?" class="w-full min-w-0 rounded-xl border border-pink-200/15 bg-black/30 px-3 py-3 text-base text-white outline-none transition placeholder:text-white/35 focus:border-pink-400 focus:ring-2 focus:ring-pink-500/20 sm:px-4 sm:py-3.5">
            </div>
            <button type="submit" class="date-submit min-h-12 w-full rounded-xl px-4 py-3 text-sm font-semibold uppercase tracking-[0.15em] text-white transition hover:-translate-y-0.5 hover:shadow-pink-500/25 focus:outline-none focus:ring-2 focus:ring-pink-300 focus:ring-offset-2 focus:ring-offset-[#16040d] sm:px-6 sm:py-4 sm:tracking-[0.2em]">
                <span class="relative z-10">Let's Go <span aria-hidden="true">💖</span></span>
            </button>
        </form>

        <p class="mt-4 text-center text-xs leading-relaxed text-white/65 sm:mt-5">Your date details will be added to a WhatsApp message. Just tap send to share it. 💌</p>
        <div class="mt-7 text-center">
            <a href="next-surprise.html" class="date-back text-xs uppercase tracking-widest text-pink-200/80 hover:text-white">← Back to the surprise</a>
        </div>
    </main>

    <script>
        const dateInput = document.getElementById('date');
        const now = new Date();
        const localToday = new Date(now.getTime() - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
        dateInput.min = localToday;

        document.getElementById('date-form').addEventListener('submit', (event) => {
            event.preventDefault();

            const form = event.currentTarget;
            const selectedDate = form.elements.date.value;
            const [year, month, day] = selectedDate.split('-').map(Number);
            const formattedDate = new Date(Date.UTC(year, month - 1, day)).toLocaleDateString('en-IN', {
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                timeZone: 'UTC'
            });
            const [hours, minutes] = form.elements.time.value.split(':').map(Number);
            const formattedTime = new Date(1970, 0, 1, hours, minutes).toLocaleTimeString([], {
                hour: 'numeric',
                minute: '2-digit'
            });
            const location = form.elements.location.value.trim().normalize('NFC');

            if (!location) {
                form.elements.location.value = '';
                form.elements.location.reportValidity();
                return;
            }

            const message = `Heyy! \u{2764}\u{FE0F}\u{1F979}

Finally, tumne mere saath ek date par jaane ka plan bana hi liya! \u{1FAE3}\u{2764}\u{FE0F}

Main is din ko tumhare saath ek khoobsurat memory banana chahta hoon. Tumhara saath, thodi si baatein, dher saari smiles aur kuch special moments... bas itna hi toh chahiye mujhe. \u{1F497}

\u{1F4C5} Date: ${formattedDate}
\u{23F0} Time: ${formattedTime}
\u{1F4CD} Location: ${location}

Ab bas tumhara intezaar rahega, Miss Beautiful! \u{1F970}

Ek promise hai, tumhare chehre par smile laane ki poori koshish karunga. \u{2764}\u{FE0F}

It's a Date, Right? \u{1FAF6}\u{1F3FB}\u{1F495}`;

            const whatsappUrl = `https://wa.me/?text=${encodeURIComponent(message.normalize('NFC'))}`;
            window.location.href = whatsappUrl;
        });
    </script>
</body>

</html>
