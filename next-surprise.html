<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <script>
        const navigationEntry = performance.getEntriesByType('navigation')[0];
        if (navigationEntry && navigationEntry.type === 'reload') {
            localStorage.removeItem('my_love_ultimate');
            const isIndexPage = location.pathname === '/' || /\/index\.html$/i.test(location.pathname);
            if (!isIndexPage) location.replace('index.html');
        }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#020202">
    <title>One More Surprise 💖</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,500;1,700&family=Dancing+Script:wght@600;700&family=Outfit:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            min-height: 100dvh;
            margin: 0;
            box-sizing: border-box;
            padding: max(1rem, env(safe-area-inset-top)) max(1rem, env(safe-area-inset-right)) max(1rem, env(safe-area-inset-bottom)) max(1rem, env(safe-area-inset-left));
            background:
                radial-gradient(ellipse at 50% 42%, rgba(120, 12, 55, 0.3), transparent 44%),
                radial-gradient(ellipse at 10% 12%, rgba(255, 91, 157, 0.12), transparent 34%),
                #070308;
            color: white;
            font-family: 'Outfit', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Twemoji Mozilla', sans-serif;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        .font-main-title {
            font-family: 'Dancing Script', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Twemoji Mozilla', cursive;
        }

        .font-elegant {
            font-family: 'Playfair Display', 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', 'Twemoji Mozilla', serif;
            font-style: italic;
        }

        .surprise-card {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            border-color: rgba(255, 160, 195, 0.2);
            background: linear-gradient(145deg, rgba(48, 14, 34, 0.84), rgba(15, 8, 15, 0.92) 58%, rgba(37, 10, 25, 0.88));
            box-shadow: 0 30px 100px rgba(190, 24, 93, 0.16), inset 0 1px 0 rgba(255, 220, 235, 0.12);
        }

        .surprise-card::before {
            position: absolute;
            z-index: -1;
            top: -9rem;
            left: 50%;
            width: 22rem;
            height: 22rem;
            border-radius: 9999px;
            background: rgba(236, 72, 153, 0.14);
            content: "";
            filter: blur(70px);
            transform: translateX(-50%);
            pointer-events: none;
        }

        .surprise-label {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: 1px solid rgba(244, 114, 182, 0.2);
            border-radius: 9999px;
            background: rgba(244, 114, 182, 0.08);
            padding: 0.45rem 0.85rem;
        }

        .surprise-art {
            position: relative;
            width: 13rem;
            aspect-ratio: 1;
            margin: 0 auto 1.5rem;
            border: 1px solid rgba(255, 190, 215, 0.42);
            border-radius: 1.65rem;
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.15), rgba(244, 63, 94, 0.12));
            padding: 0.35rem;
            box-shadow: 0 14px 40px rgba(0, 0, 0, 0.38), 0 0 32px rgba(236, 72, 153, 0.18);
            animation: art-float 5s ease-in-out infinite;
        }

        .surprise-art img {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 1.3rem;
            object-fit: cover;
        }

        .surprise-art::after {
            position: absolute;
            top: -0.75rem;
            right: -0.65rem;
            display: grid;
            width: 2rem;
            height: 2rem;
            place-items: center;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 9999px;
            background: linear-gradient(145deg, #fb7185, #db2777);
            box-shadow: 0 5px 18px rgba(236, 72, 153, 0.4);
            content: "♥";
            color: white;
            font-size: 0.9rem;
        }

        .surprise-message {
            max-width: 34rem;
            margin-right: auto;
            margin-left: auto;
            color: #ffe4ef;
            text-wrap: pretty;
        }

        .surprise-action {
            position: relative;
            overflow: hidden;
            border-color: rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.045);
        }

        .surprise-action-primary {
            border: 1px solid rgba(255, 190, 215, 0.32);
            background: linear-gradient(110deg, #be185d, #ec4899 52%, #e11d48);
            box-shadow: 0 8px 26px rgba(190, 24, 93, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .surprise-action-primary::after {
            position: absolute;
            top: 0;
            left: -130%;
            width: 60%;
            height: 100%;
            background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.22), transparent);
            content: "";
            transform: skewX(-20deg);
            transition: left 550ms ease;
            pointer-events: none;
        }

        .surprise-action-primary:hover::after {
            left: 150%;
        }

        @keyframes art-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @media (prefers-reduced-motion: reduce) {
            .surprise-art {
                animation: none;
            }

            .surprise-action-primary::after {
                transition: none;
            }
        }

        @media (max-width: 480px) and (max-height: 700px) {
            body {
                padding: max(0.5rem, env(safe-area-inset-top)) max(0.5rem, env(safe-area-inset-right)) max(0.5rem, env(safe-area-inset-bottom)) max(0.5rem, env(safe-area-inset-left));
            }

            main.w-full {
                padding: 0.75rem;
                border-radius: 1.25rem;
            }

            main > p:first-child {
                margin-bottom: 0.25rem;
                font-size: 0.625rem;
                letter-spacing: 0.2em;
            }

            main h1.font-main-title {
                margin-bottom: 0.5rem;
                font-size: 2rem;
                line-height: 1.1;
            }

            main img.w-48 {
                width: 100%;
                margin: 0;
            }

            .surprise-art {
                width: 6rem;
                margin-bottom: 0.5rem;
                border-radius: 1rem;
                padding: 0.2rem;
            }

            .surprise-art img {
                border-radius: 0.8rem;
            }

            .surprise-art::after {
                top: -0.45rem;
                right: -0.45rem;
                width: 1.4rem;
                height: 1.4rem;
                font-size: 0.7rem;
            }

            .surprise-label {
                padding: 0.3rem 0.65rem;
            }

            main img + p.font-elegant {
                margin-bottom: 0.75rem;
                font-size: 0.9375rem;
                line-height: 1.35;
            }

            main > div.flex {
                flex-direction: row;
                gap: 0.5rem;
            }

            main > div a.min-h-12 {
                min-width: 0;
                min-height: 2.75rem;
                flex: 1;
                padding: 0.5rem 0.25rem;
                font-size: 0.625rem;
                letter-spacing: 0.06em;
                line-height: 1.2;
                text-align: center;
            }
        }
    </style>
</head>

<body class="flex items-center justify-center">
    <main class="surprise-card my-auto w-full max-w-xl rounded-[2rem] border p-5 text-center backdrop-blur-xl sm:rounded-[2.5rem] sm:p-8 md:p-12">
        <p class="surprise-label mb-3 text-xs uppercase tracking-[0.3em] text-pink-200 sm:tracking-[0.4em]"><span aria-hidden="true">✦</span> A little more love <span aria-hidden="true">✦</span></p>
        <h1 class="font-main-title mb-5 text-4xl leading-tight text-pink-300 sm:mb-6 sm:text-5xl md:text-7xl">One More Surprise</h1>
        <figure class="surprise-art">
            <img src="love.webp" alt="A little reminder of our love" class="w-48">
        </figure>
        <p class="surprise-message font-elegant mb-7 text-lg leading-relaxed sm:mb-8 sm:text-xl md:text-2xl">
            Every day with you is my favorite story. Here's to all the beautiful chapters still waiting for us. 💖
        </p>
        <div class="flex w-full flex-col items-center justify-center gap-3 sm:flex-row sm:gap-4">
            <a href="index.html" class="surprise-action inline-flex min-h-12 w-full items-center justify-center rounded-full border px-5 py-3 text-xs uppercase tracking-widest text-pink-100 transition-all hover:border-pink-300/50 hover:bg-pink-500/15 hover:text-white sm:w-auto sm:px-6">Back to our story</a>
            <a href="date-invitation.html" class="surprise-action-primary inline-flex min-h-12 w-full items-center justify-center rounded-full px-5 py-3 text-xs font-medium uppercase tracking-widest text-white transition-all hover:-translate-y-0.5 hover:shadow-pink-500/30 sm:w-auto sm:px-6">Next Surprise <span class="ml-2" aria-hidden="true">→</span></a>
        </div>
    </main>
</body>

</html>
